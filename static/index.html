<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המורה הפרטי שלי</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --me:#4f46e5; --ai:#eef0f7; --text:#1f2430; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Arial, sans-serif;
         background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { background:var(--card); padding:12px 16px; display:flex; gap:12px;
           align-items:center; box-shadow:0 1px 4px rgba(0,0,0,.08); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; flex:1; }
  select, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid #cfd3e0;
                   background:#fff; cursor:pointer; }
  button:hover { background:#f0f1f8; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;
          max-width:800px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:14px; max-width:85%; white-space:pre-wrap;
         line-height:1.6; }
  .user { background:var(--me); color:#fff; align-self:flex-start; border-bottom-right-radius:4px; }
  .assistant { background:var(--ai); align-self:flex-end; border-bottom-left-radius:4px; }
  .empty { text-align:center; color:#7a8095; margin-top:60px; }
  form { background:var(--card); padding:12px; display:flex; gap:8px;
         max-width:800px; width:100%; margin:0 auto; }
  textarea { flex:1; font:inherit; padding:10px; border-radius:10px; border:1px solid #cfd3e0;
             resize:none; height:48px; }
  #send { background:var(--me); color:#fff; border:none; }
  #send:disabled { opacity:.5; cursor:wait; }
  .quick { display:flex; gap:6px; }
</style>
</head>
<body>
<header>
  <h1>🎓 המורה הפרטי שלי</h1>
  <select id="subject"></select>
  <div class="quick">
    <button id="quiz" type="button">חידון</button>
    <button id="summary" type="button">סיכום</button>
    <button id="clear" type="button">שיחה חדשה</button>
  </div>
</header>

<div id="chat"></div>

<form id="form">
  <textarea id="input" placeholder="שאל אותי כל דבר... (Enter לשליחה, Shift+Enter לשורה חדשה)"></textarea>
  <button id="send">שלח</button>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const subjectSel = document.getElementById("subject");

let messages = [];

const key = () => "tutor:" + subjectSel.value;
const save = () => localStorage.setItem(key(), JSON.stringify(messages));
const load = () => { messages = JSON.parse(localStorage.getItem(key()) || "[]"); render(); };

function bubble(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function render() {
  chat.innerHTML = "";
  if (!messages.length) {
    chat.innerHTML = '<div class="empty">בחר מקצוע ושאל את השאלה הראשונה שלך 👋</div>';
    return;
  }
  messages.forEach(m => bubble(m.role, m.content));
}

async function send(text) {
  if (!text.trim() || sendBtn.disabled) return;
  if (!messages.length) chat.innerHTML = "";
  messages.push({ role: "user", content: text });
  bubble("user", text);
  const out = bubble("assistant", "…");
  sendBtn.disabled = true;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ subject: subjectSel.value, messages }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let answer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      answer += decoder.decode(value, { stream: true });
      out.textContent = answer;
      chat.scrollTop = chat.scrollHeight;
    }
    messages.push({ role: "assistant", content: answer });
    save();
  } catch (e) {
    out.textContent = "שגיאה: בדוק ש-Ollama רץ ושהמודל הורד.";
    messages.pop();
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", e => { e.preventDefault(); const t = input.value; input.value = ""; send(t); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
document.getElementById("quiz").onclick = () =>
  send("עשה לי חידון של 3 שאלות על מה שלמדנו עד עכשיו. שאל שאלה אחת בכל פעם.");
document.getElementById("summary").onclick = () =>
  send("סכם בנקודות קצרות מה למדנו בשיעור הזה.");
document.getElementById("clear").onclick = () => { messages = []; save(); render(); };
subjectSel.onchange = load;

(async () => {
  const subjects = await (await fetch("/api/subjects")).json();
  subjects.forEach(s => subjectSel.add(new Option(s, s)));
  load();
})();
</script>
</body>
</html>
